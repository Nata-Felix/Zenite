<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b1f4b"/>
      <stop offset="1" stop-color="#090a14"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.42" cy="0.38" r="0.62">
      <stop offset="0" stop-color="#fff6d6"/>
      <stop offset="0.45" stop-color="#ffc85a"/>
      <stop offset="1" stop-color="#f08c00"/>
    </radialGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffc85a" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffc85a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="planet" gradientUnits="userSpaceOnUse" x1="0" y1="176" x2="0" y2="256">
      <stop offset="0" stop-color="#6c78f5"/>
      <stop offset="0.5" stop-color="#3d45b8"/>
      <stop offset="1" stop-color="#1c1f5e"/>
    </linearGradient>
    <clipPath id="tile"><rect width="256" height="256" rx="58"/></clipPath>
  </defs>
  <g clip-path="url(#tile)">
    <rect width="256" height="256" fill="url(#sky)"/>
    <g fill="#ffffff">
      <circle cx="44" cy="52" r="2.2" opacity="0.7"/>
      <circle cx="206" cy="40" r="1.8" opacity="0.55"/>
      <circle cx="214" cy="118" r="2.4" opacity="0.6"/>
      <circle cx="36" cy="132" r="1.6" opacity="0.45"/>
      <circle cx="180" cy="86" r="1.4" opacity="0.5"/>
      <circle cx="74" cy="96" r="1.3" opacity="0.4"/>
    </g>
    <!-- Linha do zênite: do horizonte até o sol -->
    <line x1="128" y1="176" x2="128" y2="104" stroke="#ffc85a" stroke-width="4" stroke-linecap="round" stroke-dasharray="2 10" opacity="0.8"/>
    <!-- Horizonte: o planeta visto de cima, com borda iluminada -->
    <circle cx="128" cy="372" r="196" fill="url(#planet)"/>
    <circle cx="128" cy="372" r="196" fill="none" stroke="#b9c3ff" stroke-width="5" opacity="0.9"/>
    <!-- Sol no zênite com duas órbitas cruzadas (os universos) -->
    <circle cx="128" cy="78" r="58" fill="url(#halo)"/>
    <g fill="none" stroke-linecap="round">
      <ellipse cx="128" cy="78" rx="76" ry="19" transform="rotate(-14 128 78)" stroke="#a99bff" stroke-width="5"/>
      <ellipse cx="128" cy="78" rx="50" ry="13" transform="rotate(22 128 78)" stroke="#7fd0ff" stroke-width="4" opacity="0.85"/>
    </g>
    <circle cx="128" cy="78" r="28" fill="url(#sun)"/>
    <!-- Um planeta na órbita maior, passando na frente -->
    <circle cx="86" cy="102" r="8" fill="#c9c0ff"/>
  </g>
</svg>
