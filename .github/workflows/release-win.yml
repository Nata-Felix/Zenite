# Publica o instalador do Windows quando uma tag v* é enviada
# (ex.: git tag v0.21.0 && git push origin v0.21.0).
# O instalador vai para os Releases deste mesmo repositório (Nata-Felix/O), público, onde o app
# instalado procura atualização. O GITHUB_TOKEN padrão basta.
name: Release Windows

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run security:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run release:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # O instalador visual é para quem baixa; o Setup e o blockmap são o que o latest.yml aponta
      # e o app instalado baixa na atualização completa; app-*.tar.gz e app-update.json, na leve.
      - run: |
          $v = $env:GITHUB_REF_NAME.TrimStart('v')
          gh release create $env:GITHUB_REF_NAME --repo Nata-Felix/O --title "Zênite $v" --notes-file build/release-notes.md --latest
          gh release upload $env:GITHUB_REF_NAME (Get-Item dist/Zenite-Instalador-*.exe).FullName (Get-Item dist/Zenite-Setup-*.exe).FullName (Get-Item dist/Zenite-Setup-*.exe.blockmap).FullName dist/latest.yml dist/app-update.json (Get-Item dist/app-*.tar.gz).FullName --repo Nata-Felix/O --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
